<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>董记</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3F7D5A">
<meta name="color-scheme" content="light">
<meta name="description" content="董记 —— 记录每天做过的小事">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="董记">
<meta name="format-detection" content="telephone=no">
<meta name="application-name" content="董记">
<meta name="msapplication-TileImage" content="./icons/favicon-192.png">
<meta name="msapplication-TileColor" content="#3F7D5A">

<!-- 图标：ICO 放第一位（国产浏览器/小米/华为优先读它，SVG 它们不支持） -->
<link rel="icon" href="./icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="./icons/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/favicon-192.png">
<link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
<link rel="shortcut icon" href="./icons/favicon.ico">

<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="app">
  <!-- ============ 记录页 ============ -->
  <section class="view" id="view-record">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">董记</span>
        <span class="brand-month" id="top-month">—</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-sound" aria-label="音效开关">
          <svg class="ic" width="20" height="20"><use id="u-sound" href="#dj-volume"></use></svg>
        </button>
        <button class="icon-btn" id="btn-setting" aria-label="设置">
          <svg class="ic" width="20" height="20"><use href="#dj-settings"></use></svg>
        </button>
      </div>
    </header>

    <div class="statbar" id="statbar"></div>

    <main class="scroll" id="record-scroll">
      <div class="grid" id="act-grid"></div>
      <div class="quote-card" id="quote-card">
        <svg class="quote-mark" width="16" height="16"><use href="#dj-quote"></use></svg>
        <span id="quote-text">—</span>
      </div>
      <div class="pad-bottom"></div>
    </main>
  </section>

  <!-- ============ 日历页 ============ -->
  <section class="view hidden" id="view-calendar">
    <header class="topbar cal-top">
      <button class="icon-btn" id="cal-prev" aria-label="上个月">
        <svg class="ic" width="20" height="20"><use href="#dj-chev-left"></use></svg>
      </button>
      <button class="month-title" id="cal-title">—</button>
      <button class="icon-btn" id="cal-next" aria-label="下个月">
        <svg class="ic" width="20" height="20"><use href="#dj-chev-right"></use></svg>
      </button>
    </header>

    <main class="scroll" id="cal-scroll">
      <div class="weekhead" id="weekhead"></div>
      <div class="calgrid" id="calgrid"></div>

      <div class="report">
        <div class="report-head">
          <span class="report-title">本月报告</span>
          <div class="seg" id="range-seg">
            <button class="seg-btn on" data-range="month">本月</button>
            <button class="seg-btn" data-range="90d">近90天</button>
          </div>
        </div>
        <div id="report-body"></div>
      </div>
      <div class="pad-bottom"></div>
    </main>
  </section>

  <!-- ============ 底部 Tab ============ -->
  <nav class="tabbar">
    <button class="tab on" data-view="record">
      <svg class="ic" width="22" height="22"><use href="#dj-check-circle"></use></svg>
      <span>记录</span>
    </button>
    <button class="tab" data-view="calendar">
      <svg class="ic" width="22" height="22"><use href="#dj-calendar"></use></svg>
      <span>日历</span>
    </button>
  </nav>
</div>

<!-- 浮层 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="./js/icons.js"></script>
<script src="./js/store.js"></script>
<script src="./js/stats.js"></script>
<script src="./js/sound.js"></script>
<script src="./js/ui-record.js"></script>
<script src="./js/ui-calendar.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
